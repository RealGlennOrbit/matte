<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mattetemplen – antikens sju underverk</title>
<style>
:root{--ink:#2b2118;--gold:#e0a526;--ok:#2e9e4f;--bad:#d64545;--panel:#fff8e8;--blue:#2f6fd6;--wall:#b07d3e;--wall2:#8a5d2b;--floor:#ecd5a2;--tile:#e7d3a8;--tile2:#a98448;--cur:#ffd76a}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{font-family:"Trebuchet MS","DejaVu Sans",Verdana,sans-serif;color:var(--ink);min-height:100vh;background:#d98c3a;transition:background .4s}
body.menu{background:linear-gradient(#f9d27a,#d98c3a)}
body.adult{background:#e9edf2}
body.w0{background:radial-gradient(circle at 50% 0,#7a5530,#2a1b0f 80%)}
body.w1{background:linear-gradient(#3f8f5a,#1d4a2c);--wall:#6f8f4a;--wall2:#4f6b30;--floor:#e6dcb5;--tile:#dfe9c8;--tile2:#7f9a5a;--cur:#c9f07a}
body.w2{background:linear-gradient(#b5462e,#5a1d12);--wall:#c9a46a;--wall2:#9a7a44;--floor:#f4e7c7;--tile:#f2dfc0;--tile2:#b9925a;--cur:#ffd76a}
body.w3{background:linear-gradient(#6fb9ef,#e9f4fb);--wall:#aeb8c4;--wall2:#8794a3;--floor:#f6f2e8;--tile:#e8eef5;--tile2:#9aa8b8;--cur:#bfe1ff}
body.w4{background:linear-gradient(#5b3f8a,#22163a);--wall:#9b8bb5;--wall2:#6f5e8c;--floor:#efe9f6;--tile:#e9e2f3;--tile2:#9a8ab8;--cur:#e2c8ff}
body.w5{background:linear-gradient(#2f8fc9,#0d4d78);--wall:#8a7a5a;--wall2:#5e5238;--floor:#f0e6cc;--tile:#e3eef6;--tile2:#7f9ab0;--cur:#ffe08a}
body.w6{background:radial-gradient(circle at 50% 0,#2b4c8c,#0b1630 75%);--wall:#7c8aa3;--wall2:#56637a;--floor:#eef1f6;--tile:#e5e9f2;--tile2:#8a96ab;--cur:#ffe36e}
#app{max-width:1000px;margin:0 auto;padding:12px 16px 40px}
button{font:inherit;cursor:pointer;border:none;border-radius:14px;color:inherit}
button:focus-visible,input:focus-visible{outline:4px solid #1e7cff;outline-offset:3px}
button:disabled{cursor:default}
.btn{background:var(--gold);color:#2b1a05;font-size:1.25rem;font-weight:bold;padding:12px 22px;box-shadow:0 4px 0 #9a6b0c}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #9a6b0c}
.btn.secondary{background:#efe3c6;box-shadow:0 4px 0 #b8a67c}
.btn.small{font-size:1rem;padding:8px 14px}
.btn:disabled{opacity:.5}
.panel{background:var(--panel);border-radius:22px;padding:20px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
body.w3 .panel,body.w5 .panel,body.w6 .panel,body.adult .panel{background:#fff}
h1{font-size:clamp(2rem,5vw,3.2rem);margin:.2em 0;text-align:center;color:#fff;text-shadow:0 3px 0 rgba(0,0,0,.3)}
h2{margin:.1em 0;font-size:1.7rem}
.center{text-align:center}
.warn{background:#ffe0e0;color:#7a1010;padding:10px 14px;border-radius:12px;margin:8px 0;font-weight:bold}
.top{display:flex;align-items:center;gap:10px;margin-bottom:12px;min-height:52px;flex-wrap:wrap}
.top .grow{flex:1}
.chip{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.88);border-radius:30px;padding:2px 14px 2px 4px;font-weight:bold;font-size:1.1rem}
.chip svg{display:block}

/* profiler */
.profiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px;margin-top:16px}
.pcard{position:relative;background:#fff8e8;border-radius:20px;padding:14px 10px;text-align:center;box-shadow:0 5px 0 #b8863a;font-size:1.3rem;font-weight:bold;width:100%}
.pcard:hover{transform:translateY(-3px)}
.pcard .sub{font-size:.95rem;font-weight:normal;color:#6b5332;margin-top:4px}
.pcard.new{background:rgba(255,255,255,.55);border:4px dashed #fff;box-shadow:none;color:#5a3a12;display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:190px}
.pcard.new .plus{font-size:3.5rem;line-height:1}
.del{position:absolute;top:6px;right:6px;width:34px;height:34px;border-radius:50%;background:#f1e2c4;font-size:1.2rem;font-weight:bold;color:#7a5a2a}
.avatars{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:12px;margin:12px 0 20px}
.avbtn{background:#fff;border-radius:18px;padding:8px;border:4px solid transparent;font-weight:bold}
.avbtn.on{border-color:var(--gold);background:#fff3d0}
.nameinput{font:inherit;font-size:1.8rem;padding:10px 16px;border-radius:14px;border:3px solid #c9a96a;width:100%;max-width:420px}

/* karta */
.worlds{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-bottom:14px}
.wtab{background:rgba(255,255,255,.6);padding:8px 4px;font-size:.92rem;font-weight:bold;display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.15;min-height:72px;justify-content:center}
.wtab .wn{font-size:1.3rem}
.wtab.on{background:#fff;box-shadow:0 4px 0 rgba(0,0,0,.25)}
.wtab.done .wn::after{content:" ★";color:#e0a526}
.wtab:disabled{opacity:.55}
.temple-art{display:flex;justify-content:center;margin:-6px 0 6px}
.temple-art svg{max-width:100%;height:auto}
.maphead{display:flex;align-items:center;justify-content:center;gap:14px;flex-wrap:wrap;margin:0 0 18px}
.grade{background:#efe3c6;border-radius:20px;padding:4px 12px;font-size:1rem;font-weight:bold}
.rooms{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
.room-tile{position:relative;border-radius:18px;padding:12px 6px 10px;text-align:center;min-height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:bold;font-size:1.05rem;background:var(--tile);box-shadow:0 5px 0 var(--tile2)}
.room-tile .n{position:absolute;top:6px;left:10px;font-size:.95rem;opacity:.6}
.room-tile.locked{opacity:.55;filter:grayscale(.6)}
.room-tile.current{background:var(--cur);animation:glow 1.4s ease-in-out infinite alternate}
.room-tile.done{background:#fffdf6}
.room-tile .here{position:absolute;top:-26px;right:-4px}
@keyframes glow{from{box-shadow:0 5px 0 var(--tile2),0 0 0 0 rgba(255,215,90,.9)}to{box-shadow:0 5px 0 var(--tile2),0 0 0 10px rgba(255,215,90,0)}}
.stars{color:#e0a526;font-size:1.3rem;letter-spacing:2px}
.stars .off{color:#cbbf9f}
@media (max-width:700px){.rooms{grid-template-columns:repeat(2,1fr)}.worlds{grid-template-columns:repeat(4,1fr)}}

/* rum */
.roomhead{display:flex;align-items:center;gap:14px}
.roomnum{font-size:1rem;opacity:.7;font-weight:bold}
.intro{font-size:1.35rem;margin:10px 0 6px;font-weight:bold}
.pips{display:flex;gap:8px;justify-content:center;margin:6px 0 12px}
.pip{width:22px;height:22px;border-radius:50%;background:#e2d3b0;border:3px solid #b99a5c}
.pip.done{background:var(--gold);border-color:#9a6b0c}
.pip.now{background:#fff;border-color:var(--blue)}
.prompt{min-height:120px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.eq{font-size:clamp(2.4rem,8vw,4.4rem);font-weight:bold;letter-spacing:2px}
.eq.mid{font-size:clamp(2rem,6vw,3.2rem)}
.qm{display:inline-block;min-width:1.3em;border-bottom:6px solid var(--gold);color:var(--gold)}
.box{display:inline-block;width:1.15em;height:1.05em;border:5px solid var(--gold);border-radius:10px;vertical-align:-0.1em;background:#fff}
.ask{font-size:1.4rem;font-weight:bold;margin:10px 0;max-width:720px}
.story{font-size:1.45rem;line-height:1.5;max-width:720px;margin:6px auto;background:#fff;border-radius:16px;padding:12px 18px;border:3px solid #e6d4a8}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:14px}
.opts.wide{grid-template-columns:repeat(2,1fr)}
.opts.three{grid-template-columns:repeat(3,1fr)}
.opt{background:#fff;border:4px solid #d9c08a;font-size:2.2rem;font-weight:bold;padding:12px 6px;box-shadow:0 5px 0 #b8975a;min-height:84px;display:flex;align-items:center;justify-content:center}
.opts.wide .opt,.opts.three .opt{font-size:1.6rem}
.opt:hover:not(:disabled){background:#fff6dc}
.opt.right{background:#c9f2d3;border-color:var(--ok)}
.opt.wrong{background:#f6d0d0;border-color:var(--bad);opacity:.6}
.typed{font-size:1.1rem;color:#555;min-height:1.4em;text-align:center}
.tools{display:flex;justify-content:center;gap:12px;margin-top:16px;flex-wrap:wrap;align-items:center}
.hint{background:#fffbe0;border:3px dashed var(--gold);border-radius:16px;padding:10px 14px;margin-top:12px;text-align:center;font-size:1.2rem}
.hint p{margin:.3em 0;font-weight:bold}
.hint .reveal{color:var(--ok);font-size:1.4rem}
.hintrow{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:10px}
.op{font-size:2rem}
.praise{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%) scale(.5);font-size:4rem;font-weight:bold;color:#fff;text-shadow:0 4px 0 var(--ok),0 0 20px rgba(0,0,0,.3);pointer-events:none;opacity:0;transition:all .35s;z-index:50}
.praise.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.keys{font-size:.95rem;opacity:.75;text-align:center;margin-top:14px}

/* knappsats */
.kp{display:flex;flex-direction:column;align-items:center;gap:10px;margin-top:10px}
.kpdisp{min-width:200px;font-size:2.6rem;font-weight:bold;background:#fff;border:4px solid var(--gold);border-radius:14px;padding:4px 18px;text-align:center;min-height:68px;letter-spacing:4px}
.kpdisp.bad{border-color:var(--bad);background:#fde8e8}
.kpdisp.good{border-color:var(--ok);background:#dff6e5}
.kpgrid{display:grid;grid-template-columns:repeat(3,76px);gap:8px}
.kpgrid button{background:#fff;font-size:1.9rem;font-weight:bold;height:62px;box-shadow:0 4px 0 #b8975a;border:3px solid #e2cf9f}
.kpgrid button.ok{background:var(--ok);color:#fff;border-color:#1d7a3a;box-shadow:0 4px 0 #1d6a33}
.kpgrid button.kdel{font-size:1.05rem}

/* bilder */
.dots{display:inline-flex;flex-wrap:wrap;gap:6px;max-width:280px;justify-content:center}
.five{display:inline-flex;gap:3px;padding:3px;border-radius:8px;background:rgba(0,0,0,.05)}
.dot{width:18px;height:18px;border-radius:50%;display:inline-block}
.dot.blue{background:#2f6fd6}.dot.gold{background:#e0a526}.dot.green{background:#2e9e4f}.dot.empty{background:#fff;border:2px dashed #aaa}
.dot.x{background:#ccc;position:relative}
.dot.x::after{content:"";position:absolute;left:-2px;right:-2px;top:7px;height:4px;background:#d64545;transform:rotate(-45deg)}
.group{display:inline-flex;flex-direction:column;align-items:center;background:#fff;border:3px solid #d9c08a;border-radius:12px;padding:6px}
.group .lab{font-size:1rem;font-weight:bold;color:#2456a8}
.to{display:inline-flex;align-items:flex-end;gap:3px;flex-wrap:wrap;max-width:300px;justify-content:center}
.hun{display:inline-block;width:56px;height:56px;background:repeating-linear-gradient(90deg,#8e44ad 0 5px,#6c2f87 5px 5.6px),#8e44ad;border-radius:4px;opacity:.9}
.ten{display:inline-block;width:12px;height:60px;background:repeating-linear-gradient(#2f6fd6 0 5px,#1d4ea0 5px 6px);border-radius:3px}
.one{display:inline-block;width:12px;height:12px;background:#e0a526;border-radius:3px}
.tobox{display:inline-flex;flex-direction:column;align-items:center;gap:4px}
.tobox small{font-size:.95rem}
.pvt{border-collapse:collapse;font-size:1.6rem;font-weight:bold;margin:6px auto}
.pvt td,.pvt th{border:3px solid #d9c08a;padding:4px 16px;text-align:center;background:#fff}
.pvt th{font-size:1rem;background:#fff3d6}
.seq{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
.cell{min-width:72px;height:72px;padding:0 6px;background:#fff;border:3px solid #d9c08a;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:2rem;font-weight:bold}
.cell.q{border-style:dashed;border-color:var(--gold);color:var(--gold);font-size:2.6rem}
.chunk{display:flex;gap:4px;padding:5px;border:3px solid var(--blue);border-radius:14px}
.chunk .cell{min-width:56px;height:56px}
.chunk .cell svg{width:42px;height:42px}
.items{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:560px}
.coins{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;max-width:560px}
.shop{display:flex;align-items:center;gap:14px;justify-content:center;flex-wrap:wrap}
.tag{background:#fff;border:3px solid #c0392b;border-radius:10px;padding:4px 10px;font-size:1.6rem;font-weight:bold;color:#c0392b}
.arrow{font-size:2.4rem}
.jumps{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:center;font-size:1.5rem;font-weight:bold}
.jumps .j{color:var(--ok);font-size:1.1rem}
.frac{display:inline-flex;flex-direction:column;align-items:center;line-height:1;vertical-align:middle;font-weight:bold}
.frac span:first-child{border-bottom:3px solid currentColor;padding:0 4px 2px}
.frac span:last-child{padding-top:2px}
.posgrid{display:inline-grid;grid-template-columns:repeat(3,84px);grid-template-rows:repeat(3,84px);gap:6px;background:#e9d8ae;padding:8px;border-radius:16px}
.posgrid div{background:#fff8e8;border-radius:12px;display:flex;align-items:center;justify-content:center}
.posgrid div.ref{outline:5px solid var(--blue)}
.inl{display:inline-block;vertical-align:middle}
.ptable{border-collapse:collapse;margin:6px auto;font-size:1.3rem}
.ptable td,.ptable th{border:2px solid #d9c08a;padding:4px 14px;background:#fff}
.written{font-family:"DejaVu Sans Mono",monospace;font-size:2.6rem;font-weight:bold;border-collapse:collapse;margin:0 auto}
.written td{padding:0 6px;text-align:center;min-width:1.2em}
.written .carry{font-size:1.2rem;color:var(--bad);height:1.4rem}
.written tr.sum td{border-top:5px solid var(--ink)}

.scalebox{width:100%;display:flex;justify-content:center}
.scalebox svg{width:540px;max-width:100%;height:auto}
.scale .beam,.scale .pan{transition:transform .9s cubic-bezier(.3,1.4,.6,1)}
.scale .w rect{fill:#555}.scale .w text,.scale .uk text{fill:#fff;font-size:18px;font-weight:bold;text-anchor:middle;font-family:inherit}
.scale .uk rect{fill:#fff;stroke:#e0a526;stroke-width:3;stroke-dasharray:6 4}
.scale .uk text{fill:#e0a526}
.scale .uk rect.filled{fill:#e0a526;stroke-dasharray:none}
.scale .uk rect.filled+text{fill:#fff}

/* ringtorn */
.hanoi{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:10px 0}
.peg{position:relative;height:250px;background:rgba(0,0,0,.04);border:4px solid transparent;border-radius:16px;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;padding:0 6px 34px}
.peg .pole{position:absolute;bottom:30px;left:50%;width:12px;margin-left:-6px;height:200px;background:#8a5d2b;border-radius:6px 6px 0 0}
.peg .base{position:absolute;bottom:22px;left:6%;right:6%;height:10px;background:#8a5d2b;border-radius:5px}
.peg.target .base,.peg.target .pole{background:var(--ok)}
.peg .num{position:absolute;bottom:0;left:0;right:0;font-weight:bold;font-size:1.1rem}
.peg.sel{border-color:var(--blue);background:#e8f0ff}
.peg.goal{border-color:var(--ok);border-style:dashed}
.stack{display:flex;flex-direction:column-reverse;align-items:center;width:100%;z-index:1}
.ring{display:block;height:22px;border-radius:11px;margin-top:3px;border:3px solid rgba(0,0,0,.25);transition:transform .2s}
.ring.lift{transform:translateY(-26px)}
.ring.glow{box-shadow:0 0 0 5px #fff,0 0 0 9px var(--blue)}
.msg{min-height:1.6em;font-weight:bold;font-size:1.2rem;text-align:center;color:var(--bad)}
.msg.good{color:var(--ok)}

/* rutnät: stenblock och program */
.pushwrap{display:flex;flex-wrap:wrap;gap:18px;align-items:center;justify-content:center}
.grid{display:grid;gap:0;border-radius:10px;overflow:hidden;box-shadow:0 6px 0 rgba(0,0,0,.25)}
.t{width:var(--c);height:var(--c);display:flex;align-items:center;justify-content:center;position:relative}
.t.wall{background:var(--wall);box-shadow:inset 0 0 0 2px var(--wall2),inset 0 -6px 0 rgba(0,0,0,.15)}
.t.floor{background:var(--floor)}
.t.plate::before{content:"";position:absolute;inset:18%;border-radius:50%;background:#ffd25a;border:4px solid #c8961a}
.block{position:absolute;inset:8%;background:#8c6a44;border-radius:8px;border:4px solid #5e4425;box-shadow:inset 0 -6px 0 rgba(0,0,0,.2);z-index:2}
.block.on{background:#e0a526;border-color:#9a6b0c}
.me{position:absolute;z-index:3;display:flex;transition:all .2s}
.goalc{position:absolute;inset:10%;display:flex;align-items:center;justify-content:center}
.pad{display:grid;grid-template-columns:repeat(3,64px);grid-template-rows:repeat(3,64px);gap:6px}
.pad button{background:#fff;font-size:2rem;font-weight:bold;box-shadow:0 4px 0 #b8975a}
.pad .u{grid-column:2;grid-row:1}.pad .l{grid-column:1;grid-row:2}.pad .r{grid-column:3;grid-row:2}.pad .d{grid-column:2;grid-row:3}
.progside{display:flex;flex-direction:column;align-items:center;gap:10px}
.progside{max-width:380px}
.pstrip{display:flex;flex-wrap:wrap;gap:6px;min-height:58px;max-width:370px;background:#fff;border:3px dashed #c9a96a;border-radius:14px;padding:6px;align-items:center;justify-content:center}
.cmd{background:#2f6fd6;color:#fff;font-weight:bold;font-size:1.4rem;border-radius:10px;padding:4px 10px;min-width:44px;text-align:center}
.cmd.now{background:#e0a526;color:#222}
.mults{display:flex;gap:5px;align-items:center;font-weight:bold;flex-wrap:wrap;justify-content:center}
.mults button{background:#fff;width:40px;height:42px;font-size:1.3rem;font-weight:bold;box-shadow:0 3px 0 #b8975a}
.mults button.on{background:var(--gold)}

/* overlay */
.overlay{position:fixed;inset:0;background:rgba(20,12,4,.7);display:flex;align-items:center;justify-content:center;z-index:40;padding:16px;overflow:auto}
.dialog{background:#fff8e8;border-radius:24px;padding:24px;max-width:560px;width:100%;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.dialog .bigstars{font-size:3.4rem;color:#e0a526;letter-spacing:6px}
.dialog .bigstars .off{color:#d8ccb0}
.dialog .btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:16px}
.dialog .fact{font-size:1.25rem;text-align:left;line-height:1.45}
.dialog .fact li{margin:.35em 0}
.door{position:relative;width:170px;height:200px;margin:0 auto 10px;border-radius:85px 85px 0 0;background:radial-gradient(circle at 50% 60%,#fff6b0,#ffc93c 60%,#e08a00);overflow:hidden;border:8px solid #8a5d2b}
.door i{position:absolute;top:0;bottom:0;width:50%;background:repeating-linear-gradient(90deg,#7a4f22 0 18px,#6a421a 18px 22px);transition:transform 1.2s ease-in .2s}
.door i.l{left:0}.door i.r{right:0}
.door.open i.l{transform:translateX(-100%)}.door.open i.r{transform:translateX(100%)}
.door .who{position:absolute;bottom:4px;left:50%;transform:translateX(-50%)}
.confetti{position:fixed;top:-20px;width:12px;height:18px;z-index:60;pointer-events:none;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* lärarvy */
.kids{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0 18px}
.kid{background:#f3f5f8;border:3px solid transparent;border-radius:14px;padding:6px 12px 6px 6px;display:flex;align-items:center;gap:6px;font-weight:bold;font-size:1.1rem}
.kid.on{border-color:var(--blue);background:#e8f0ff}
.areas{width:100%;border-collapse:collapse;font-size:1.05rem}
.areas td,.areas th{padding:8px 6px;border-bottom:1px solid #e3e6ea;text-align:left;vertical-align:top}
.areas th{font-size:.95rem;color:#5a6472}
.bar{height:16px;background:#e9edf2;border-radius:8px;overflow:hidden;min-width:120px}
.bar i{display:block;height:100%}
.st{display:inline-block;border-radius:10px;padding:2px 9px;font-size:.9rem;font-weight:bold;margin:2px 4px 2px 0}
.st.s3{background:#d4f2dc;color:#1d6a33}.st.s2{background:#fff0c7;color:#7a5600}.st.s1{background:#fbdada;color:#8a1f1f}.st.s0{background:#eceff3;color:#6b7480}

const KEY = 'mattetemplen.v2', OLDKEY = 'mattetemplen.v1';
let storageOK = true;
function loadStore(){
  try{
    localStorage.setItem(KEY+'.test','1'); localStorage.removeItem(KEY+'.test');
    const s = localStorage.getItem(KEY);
    if(s){ const d = JSON.parse(s); if(d && Array.isArray(d.profiles)) return d; }
    const o = localStorage.getItem(OLDKEY);
    if(o){ const d = JSON.parse(o); if(d && Array.isArray(d.profiles)) return {profiles:d.profiles.map(p => ({id:p.id, name:p.name, avatar:p.avatar, progress:{}, stats:{}, unlocked:0, created:p.created, last:p.last})), sound:d.sound}; }
  }catch(e){ storageOK = false; }
  return {profiles:[], sound:true};
}

function distract(ans, cands, count=3, min=0){
  const s = new Set();
  shuffle(cands.filter(v => v!==ans && v>=min && Number.isInteger(v))).forEach(v => { if(s.size<count) s.add(v); });
  let d = 1;
  while(s.size<count){ [ans+d, ans-d].forEach(v => { if(s.size<count && v>=min && v!==ans) s.add(v); }); d++; }
  return shuffle([ans, ...s]);
}

let actx = null;
function tone(f, dur, type='sine', when=0, vol=.15){
  if(store.sound === false) return;
  try{
    actx = actx || new (window.AudioContext||window.webkitAudioContext)();
    const t = actx.currentTime + when, o = actx.createOscillator(), g = actx.createGain();
    o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.001, t+dur);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t+dur+.05);
  }catch(e){}
}

const eq = (s, cls='') => `<div class="eq ${cls}">${s} = <span class="qm">?</span></div>`;

function dots(n, cls, crossLast=0, empty=0){
  let s = '<span class="dots">';
  const tot = n + empty;
  for(let g=0; g<tot; g+=5){
    s += '<span class="five">';
    for(let i=g; i<Math.min(tot,g+5); i++) s += `<span class="dot ${i >= n ? 'empty' : (i >= n-crossLast ? 'x' : cls)}"></span>`;
    s += '</span>';
  }
  return s + '</span>';
}

}

function tCount(max, set){

}
function tCompare(max){
  const type = rnd(0,2);
  if(type === 0){
    const nums = new Set(); while(nums.size < 4) nums.add(rnd(0,max));
    const arr = [...nums], ans = Math.max(...arr);
    return sk({prompt:'<p class="ask" style="font-size:1.8rem">Vilket tal är störst?</p>', answer:ans, options:shuffle(arr), mcOnly:true,
      hint:`<p>Titta på tiotalen först. Sedan på entalen.</p><div class="jumps">${[...arr].sort((a,b)=>a-b).map(n => `<span>${n}</span>`).join('<span class="j">&lt;</span>')}</div>`}, 'antal');
  }
  if(type === 1){
    const n = rnd(1, max-1);
    return sk({prompt:`<p class="ask" style="font-size:1.8rem">Vilket tal kommer efter</p><div class="eq">${n}</div>`, answer:n+1, options:distract(n+1,[n-1,n+2,n+10]),
      hint:`<p>Räkna ett steg framåt.</p><div class="jumps"><span>${n}</span><span class="j">+1 →</span><span style="color:#e0a526">?</span></div>`}, 'antal');
  }
  const n = rnd(2, max-1);
  return sk({prompt:`<p class="ask" style="font-size:1.8rem">Vilket tal står mellan</p><div class="eq">${n-1} och ${n+1}</div>`, answer:n, options:distract(n,[n-2,n+2,n+1,n-1]),
    hint:`<div class="jumps"><span>${n-1}</span><span class="j">+1 →</span><span style="color:#e0a526">?</span><span class="j">+1 →</span><span>${n+1}</span></div>`}, 'antal');
}
function tFriends(total){
  const a = rnd(1, total-1), b = total - a;
  return sk({prompt:`<div class="eq">${total} = ${a} + ${BOX}</div><div style="margin-top:8px">${dots(a,'blue',0,b)}</div><p class="ask">Hur många fattas?</p>`, answer:b,
    options:distract(b,[b+1,b-1,a,total]), hint:`<p>Räkna de tomma rutorna!</p>${dots(a,'blue',0,b)}`}, 'tiokompisar');
}
function tPlus(max, carry=false){
  let a, b;
  if(carry){ do{ a = rnd(3,9); b = rnd(11-a, Math.min(9, max-a)); } while(a+b > max || a+b <= 10); if(Math.random()<.5) [a,b] = [b,a]; }
  else { do{ a = rnd(1,max-1); b = rnd(1,max-a); } while(max>10 && a+b<=10); }
  const ans = a+b;
  return sk({prompt:eq(`${a} + ${b}`), answer:ans, options:distract(ans,[ans+1,ans-1,ans+2,ans-2,ans+10,a,b]),
    hint:`<p>${carry ? `Fyll upp till 10 först: ${Math.max(a,b)} + ${10-Math.max(a,b)} = 10. Sedan resten.` : 'Räkna alla prickar!'}</p><div class="hintrow">${dots(a,'blue')}<b class="op">+</b>${dots(b,'gold')}</div>`}, max<=10 ? 'pm10' : 'pm20');
}
function tMinus(max, carry=false){
  let a, b;
  if(carry){ do{ a = rnd(11, max); } while(a%10 === 9); b = rnd(a%10+1, 9); }
  else { a = rnd(Math.max(3, max-9), max); b = rnd(1, a-1); }
  const ans = a-b;
  return sk({prompt:eq(`${a} − ${b}`), answer:ans, options:distract(ans,[ans+1,ans-1,ans+2,ans-2,a+b]),
    hint:`<p>${carry ? `Ta först bort ${a-10} så att du kommer till 10. Ta sedan bort resten.` : `Det finns ${a}. Ta bort ${b}. Hur många är kvar?`}</p><div class="hintrow">${dots(a,'blue',b)}</div>`}, max<=10 ? 'pm10' : 'pm20');
}
function tPV100(){
  const type = rnd(0,2), n = rnd(11,99), t = Math.floor(n/10), e = n%10;
  if(type === 0) return sk({prompt:`<div class="hintrow">${'<i class="ten"></i>'.repeat(t)} ${'<i class="one"></i>'.repeat(e)}</div><p class="ask">Vilket tal är det? Stavarna är tiotal och rutorna ental.</p>`, answer:n,
    options:distract(n,[e*10+t, n+10, n-10, n+1]), hint:`<p>Räkna tiotalen: 10, 20, 30 … Lägg sedan till entalen.</p>${tensOnes(n)}`}, 'pos100');
  if(type === 1) return sk({prompt:`<p class="ask" style="font-size:1.6rem">${t} tiotal och ${e} ental.<br>Vilket tal är det?</p>`, answer:n,
    options:distract(n,[e*10+t, t+e, n+10]), hint:tensOnes(n)}, 'pos100');
  return sk({prompt:`<p class="ask" style="font-size:1.6rem">Hur många tiotal finns det i talet</p><div class="eq">${n}</div>`, answer:t,
    options:distract(t,[e, t+1, t-1, n]), hint:tensOnes(n)}, 'pos100');

function tMental100(carry){
  let a, b, plus = Math.random() < .55, ans;
  if(!carry){
    const k = rnd(0,2);
    if(k===0){ a = rnd(1,8)*10; b = rnd(1, 9-a/10)*10; }
    else if(k===1){ a = rnd(2,8)*10 + rnd(0,5); b = rnd(1, 9-a%10); }
    else { a = rnd(2,8)*10 + rnd(1,8); b = rnd(1, 9-Math.floor(a/10))*10; }
    if(!plus){ const s = a + b; a = s; }
    ans = plus ? a+b : a-b;
  } else {
    if(plus){ do{ a = rnd(15,75); b = rnd(5, 99-a); } while((a%10)+(b%10) < 10); ans = a+b; }
    else { do{ a = rnd(30,99); b = rnd(5, a-10); } while((a%10) >= (b%10)); ans = a-b; }
  }
  return sk({prompt:eq(`${a} ${plus?'+':'−'} ${b}`), answer:ans, options:distract(ans,[ans+10,ans-10,ans+1,ans-1,ans+2]),
    hint:`<p>${plus ? 'Räkna tiotalen för sig och entalen för sig.' : 'Ta bort tiotalen först. Sedan entalen.'}</p><div class="hintrow">${tensOnes(a)}<b class="op">${plus?'+':'−'}</b>${tensOnes(b)}</div>`}, 'huvud100');
}
function runningHint(list){

function tMoney(maxSum, kinds){

function tChange(easy){
  const have = easy ? pick([20,50]) : pick([20,50,100,100]);
  let price = easy ? rnd(1, have/5 - 1)*5 : (have===20 ? rnd(5,18) : have===50 ? rnd(12,47) : rnd(25,95));
  const ans = have - price;
  let j = `<span>${price}</span>`, cur = price;
  if(cur % 10){ const nx = Math.ceil(cur/10)*10; j += `<span class="j">+${nx-cur} →</span><span>${nx}</span>`; cur = nx; }
  if(cur < have) j += `<span class="j">+${have-cur} →</span><span>${have}</span>`;
  return sk({prompt:`<div class="shop">${money(have)}<span class="arrow">→</span>${glyph('amfora',80)}<span class="tag">${price} kr</span></div><p class="ask">Du betalar ${have} kr. Vasen kostar ${price} kr.<br>Hur mycket får du tillbaka?</p>`,
    answer:ans, options:distract(ans,[ans+1,ans-1,ans+10,ans-10,price]),
    hint:`<p>Räkna uppåt från ${price} till ${have}!</p><div class="jumps">${j}</div><p>Lägg ihop hoppen.</p>`}, 'pengar');

function barChart(cats, vals, step, title){
  const W = 420, H = 230, x0 = 46, y0 = 196, top = Math.max(...vals) + step, ys = (y0-20)/top;
  let g = '';
  for(let v=0; v<=top; v+=step) g += `<line x1="${x0}" y1="${y0-v*ys}" x2="${W-6}" y2="${y0-v*ys}" stroke="#ddd"/><text x="${x0-8}" y="${y0-v*ys+5}" font-size="14" text-anchor="end" fill="#555">${v}</text>`;
  const bw = (W-x0-20)/cats.length;
  const cols = ['#2f6fd6','#e0a526','#2e9e4f','#d64545'];
  cats.forEach((c,i) => {
    const x = x0 + 10 + i*bw;
    g += `<rect x="${x+bw*0.18}" y="${y0-vals[i]*ys}" width="${bw*0.64}" height="${vals[i]*ys}" fill="${cols[i]}" rx="3"/><text x="${x+bw/2}" y="${y0+20}" font-size="15" font-weight="bold" text-anchor="middle" fill="#333">${c}</text>`;
  });
  return `<svg viewBox="0 0 ${W} ${H+10}" width="${W}" height="${H+10}" style="max-width:100%;background:#fff;border-radius:12px"><text x="${W/2}" y="16" font-size="15" font-weight="bold" text-anchor="middle">${title}</text><line x1="${x0}" y1="${y0}" x2="${W-6}" y2="${y0}" stroke="#333" stroke-width="2"/><line x1="${x0}" y1="20" x2="${x0}" y2="${y0}" stroke="#333" stroke-width="2"/>${g}</svg>`;
}

    () => { const a=rnd(7,12), b=rnd(25,60); return {t:`Johan är ${a} år. Hans morfar är ${b} år äldre.<br>Hur gammal är morfar?`, a:a+b, h:`${a} + ${b}`}; },
  ];
  const L3 = [
    () => { const a=rnd(120,400), b=rnd(20,a-50), c=rnd(30,200); return {t:`Skeppet har ${a} säckar. I hamnen lastas ${b} säckar av och ${c} nya säckar på.<br>Hur många säckar finns på skeppet nu?`, a:a-b+c, h:`Steg 1: ${a} − ${b} = ${a-b}. Steg 2: ${a-b} + ${c}.`}; },
    () => { const p=rnd(5,20), n=rnd(2,4); return {t:`En biljett till fyren kostar ${p} kr. Ni köper ${n} biljetter och betalar med 100 kr.<br>Hur mycket får ni tillbaka?`, a:100-p*n, h:`Steg 1: ${n} · ${p} = ${p*n} kr. Steg 2: 100 − ${p*n}.`}; },
    () => { const h=rnd(100,140), t=rnd(12,35); return {t:`Fyren är ${h} m hög. Ett träd är ${t} m högt.<br>Hur mycket högre är fyren?`, a:h-t, h:`${h} − ${t}`}; },
    () => { const n=rnd(3,6), k=pick([4,5,10]), s=rnd(5, n*k-3); return {t:`I templet finns ${n} rader med ${k} stolar i varje rad. ${s} stolar är upptagna.<br>Hur många stolar är lediga?`, a:n*k-s, h:`Steg 1: ${n} · ${k} = ${n*k} stolar. Steg 2: ${n*k} − ${s}.`}; },
    () => { const x=rnd(4,20)*3; return {t:`Tre vänner delar ${x} kr lika.<br>Hur mycket får var och en?`, a:x/3, h:`${x} / 3. Tänk: 3 · ? = ${x}`}; },
    () => { const a=rnd(150,480), b=rnd(120,999-a-20); return {t:`${a} turister besöker underverket på förmiddagen och ${b} på eftermiddagen.<br>Hur många turister blev det sammanlagt?`, a:a+b, h:`${a} + ${b}. Ställ gärna upp talen.`}; },
  ];
  const g = pick(level===1 ? L1 : level===2 ? L2 : L3)();
  return sk({prompt:`<div class="story">${g.t}</div>`, answer:g.a, options:distract(g.a,[g.a+1,g.a-1,g.a+10,g.a-10]),
    hint:`<p>Vad vet du? Vad ska du ta reda på?</p><p>Räkna: ${g.h}</p>${g.p ? `<div class="hintrow">${g.p.join(' ')}</div>` : ''}`}, 'problem');
}

/* ================= Spelare ================= */
let player = null;
function prog(wi){
  player.progress = player.progress || {};
  const id = WORLDS[wi].id;
  const p = player.progress[id] = player.progress[id] || {done:0, stars:[]};
  if(!Array.isArray(p.stars)) p.stars = [];
  return p;
}
const worldOpen = wi => wi === 0 || (player.unlocked||0) >= wi || prog(wi-1).done >= 8;
const totalStars = pl => sum(Object.values(pl.progress||{}).map(p => sum(p.stars||[])));
function curWorld(pl){
  const save = player; player = pl;
  let w = 0; for(let i=0;i<WORLDS.length;i++) if(worldOpen(i)) w = i;
  const p = prog(w); player = save;
  return {w, room:p.done};
}
function record(skill, ok){
  if(!player || !skill) return;
  player.stats = player.stats || {};
  const s = player.stats[skill] = player.stats[skill] || {n:0, ok:0};
  s.n++; if(ok) s.ok++;
  saveStore();
}
function starsHtml(n, max=3){ return '<span class="stars">' + repeat(max, i => i<n ? '★' : '<span class="off">★</span>').join('') + '</span>'; }
function setTheme(t){ document.body.className = t; }
function topbar(left){
  return `<div class="top">${left||''}<div class="grow"></div>
    ${player ? `<span class="chip">${avatarSVG(player.avatar,44)}${esc(player.name)} <span class="stars">★</span>${totalStars(player)}</span>` : ''}
    <button class="btn secondary small" id="snd">${store.sound===false ? 'Ljud av' : 'Ljud på'}</button></div>
    ${storageOK ? '' : '<div class="warn">Obs! Den här webbläsaren kan inte spara. Spelet glöms när du stänger.</div>'}`;
}
function wireTop(){
  const b = document.getElementById('snd');
  if(b) b.onclick = () => { store.sound = store.sound===false; saveStore(); b.textContent = store.sound ? 'Ljud på' : 'Ljud av'; sfx.click(); };
}
function overlay(html){
  const ov = document.createElement('div'); ov.className = 'overlay'; ov.innerHTML = `<div class="dialog">${html}</div>`;
  document.body.appendChild(ov); return ov;
}

function confirmDelete(id){
  const p = store.profiles.find(x => x.id === id); if(!p) return;
  const ov = overlay(`${avatarSVG(p.avatar,90)}<h2>Ta bort ${esc(p.name)}?</h2><p style="font-size:1.2rem">Allt som ${esc(p.name)} har sparat försvinner.</p><div class="btns"><button class="btn secondary" id="no">Nej</button><button class="btn" id="yes" style="background:#e46b6b;box-shadow:0 4px 0 #9a2d2d">Ja, ta bort</button></div>`);
  const close = () => { ov.remove(); keyHandler = null; };
  ov.querySelector('#no').onclick = close;
  ov.querySelector('#yes').onclick = () => { store.profiles = store.profiles.filter(x => x.id !== id); saveStore(); close(); if(document.body.classList.contains('adult')) showAdult(); else showProfiles(); };
  ov.querySelector('#no').focus();
  keyHandler = e => { if(e.key === 'Escape') close(); };
}

/* ================= Vuxenkod ================= */
function askCode(onOk, title){
  const creating = !store.code;
  let buf = '', first = null;
  const ov = overlay(`<h2>${esc(title)}</h2><p id="ct" style="font-size:1.15rem">${creating ? 'Välj en vuxenkod med 4 siffror. Den skyddar lärarvyn.' : 'Skriv vuxenkoden.'}</p>
    <div class="kp"><div class="kpdisp" id="cd">&nbsp;</div><div class="kpgrid">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-n="${n}">${n}</button>`).join('')}<button data-n="del" class="kdel">Sudda</button><button data-n="0">0</button><button data-n="ok" class="ok">OK</button></div></div>
    <div class="btns"><button class="btn secondary small" id="cx">Avbryt</button></div>`);
  const cd = ov.querySelector('#cd'), ct = ov.querySelector('#ct');
  const show = () => cd.innerHTML = buf ? '•'.repeat(buf.length) : '&nbsp;';
  const close = () => { ov.remove(); keyHandler = prevKH; };
  const prevKH = keyHandler;
  const press = n => {
    if(n === 'del'){ buf = buf.slice(0,-1); show(); return; }
    if(n === 'ok'){
      if(buf.length !== 4){ cd.classList.add('shake'); setTimeout(()=>cd.classList.remove('shake'),400); return; }
      if(creating){
        if(first === null){ first = buf; buf = ''; show(); ct.textContent = 'Skriv samma kod en gång till.'; return; }
        if(first !== buf){ first = null; buf = ''; show(); ct.textContent = 'Koderna var olika. Välj en ny kod med 4 siffror.'; return; }
        store.code = buf; saveStore(); close(); onOk(); return;
      }
      if(buf === store.code){ close(); onOk(); }
      else { buf = ''; show(); cd.classList.add('bad'); sfx.bad(); setTimeout(()=>cd.classList.remove('bad'),600); }
      return;
    }
    if(buf.length < 4){ buf += n; show(); }
  };
  ov.querySelectorAll('.kpgrid button').forEach(b => b.onclick = () => press(b.dataset.n));
  ov.querySelector('#cx').onclick = close;
  keyHandler = e => { if(/^[0-9]$/.test(e.key)) press(e.key); else if(e.key==='Backspace') press('del'); else if(e.key==='Enter'){ e.preventDefault(); press('ok'); } else if(e.key==='Escape') close(); };
}

  if(!s || s.n === 0) return [0,'Inte tränat'];
  const r = s.ok / s.n;
  if(s.n >= 6 && r >= .8) return [3,'Säker'];
  if(r >= .5) return [2,'På väg'];
  return [1,'Behöver träna'];
}

/* ================= Motor: frågor ================= */
function runQuiz(el, tasks, done, onEsc, keypad){
  let i = 0, mistakes = 0, wrongHere = 0, locked = false, buf = '', bufT = null, firstTry = true, mode = 'mc';
  el.innerHTML = `<div class="pips">${tasks.map(() => '<span class="pip"></span>').join('')}</div>
    <div class="prompt" id="pr"></div><div class="hint" id="hi" hidden></div><div class="typed" id="ty"></div>
    <div id="ans"></div><div class="tools"><button class="btn secondary small" id="lamp">Ledtråd</button></div><p class="keys" id="kh"></p>`;
  const pr = el.querySelector('#pr'), hi = el.querySelector('#hi'), ans = el.querySelector('#ans'), ty = el.querySelector('#ty'), kh = el.querySelector('#kh');
  let op = null, kd = null;
  function show(){
    const t = tasks[i]; window.__task = t;
    wrongHere = 0; locked = false; buf = ''; firstTry = true; ty.textContent = '';
    mode = keypad && typeof t.answer === 'number' && !t.mcOnly ? 'kp' : 'mc';
    pr.innerHTML = t.render ? t.render() : t.prompt;
    hi.hidden = true; hi.innerHTML = '';
    if(mode === 'mc'){
      ans.innerHTML = `<div class="opts ${t.optClass||''}" id="op">${t.options.map((v,k) => `<button class="opt" data-k="${k}">${t.fmt ? t.fmt(v) : esc(v)}</button>`).join('')}</div>`;
      op = ans.querySelector('#op'); kd = null;
      op.querySelectorAll('.opt').forEach(b => b.onclick = () => choose(+b.dataset.k));
      kh.textContent = typeof t.options[0] === 'number' ? 'Klicka på svaret. Du kan också skriva siffrorna och trycka Enter, eller använda pilarna.' : 'Klicka på svaret, eller välj med pilarna och tryck Enter.';
    } else {
      ans.innerHTML = `<div class="kp"><div class="kpdisp" id="kd">?</div><div class="kpgrid">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-n="${n}">${n}</button>`).join('')}<button data-n="del" class="kdel">Sudda</button><button data-n="0">0</button><button data-n="ok" class="ok">OK</button></div></div>`;
      kd = ans.querySelector('#kd'); op = null;
      ans.querySelectorAll('.kpgrid button').forEach(b => b.onclick = () => kpPress(b.dataset.n));
      kh.textContent = 'Skriv ditt svar med knapparna eller tangentbordet och tryck OK (Enter).';
    }
    el.querySelectorAll('.pip').forEach((p,k) => p.className = 'pip' + (k < i ? ' done' : (k === i ? ' now' : '')));
  }
  function showHint(reveal){
    const t = tasks[i];
    if(hi.hidden){ hi.innerHTML = t.hint; hi.hidden = false; }
    if(reveal && !hi.querySelector('.reveal')) hi.insertAdjacentHTML('beforeend', `<p class="reveal">Rätt svar är ${t.answer}. Skriv in det!</p>`);
  }
  function right(){
    const t = tasks[i]; locked = true; sfx.ok(); praise();
    setTimeout(() => { i++; if(i >= tasks.length){ el.querySelectorAll('.pip').forEach(p => p.className = 'pip done'); done(mistakes <= 1 ? 3 : mistakes <= 4 ? 2 : 1); } else show(); }, t.update ? 1400 : 900);
  }
  function wrong(){
    mistakes++; wrongHere++; sfx.bad();
    const sh = op || kd; sh.classList.remove('shake'); void sh.offsetWidth; sh.classList.add('shake');
    if(wrongHere >= 2) showHint(mode === 'kp' && wrongHere >= 3);
  }
  function check(v){
    const t = tasks[i], ok = v === t.answer;
    if(firstTry){ record(t.skill, ok); firstTry = false; }
    return ok;
  }
  function choose(k){
    if(locked) return;
    const t = tasks[i], v = t.options[k], b = op.children[k];
    if(!b || b.disabled) return;
    if(t.update) t.update(pr, v);
    if(check(v)){ b.classList.add('right'); right(); }
    else {
      b.classList.add('wrong'); b.disabled = true; wrong();
      if(t.update) setTimeout(() => { if(!locked) t.update(pr, null); }, 1300);
    }
  }
  function kpPress(n){
    if(locked) return;
    if(n === 'del'){ buf = buf.slice(0,-1); }
    else if(n === 'ok'){
      if(!buf) return;
      const v = +buf, t = tasks[i];
      if(t.update) t.update(pr, v);
      if(check(v)){ kd.className = 'kpdisp good'; right(); return; }
      kd.className = 'kpdisp bad'; wrong(); buf = '';
      setTimeout(() => { if(!locked){ kd.className = 'kpdisp'; kd.textContent = buf || '?'; if(t.update) t.update(pr, null); } }, 700);
      return;
    }
    else if(buf.length < 4){ buf = (buf === '0' ? '' : buf) + n; }
    kd.className = 'kpdisp'; kd.textContent = buf || '?';
  }
  el.querySelector('#lamp').onclick = () => { if(hi.hidden){ mistakes += .5; showHint(false); } };
  function resolveBuf(force){
    const t = tasks[i]; clearTimeout(bufT);
    const idx = t.options.findIndex((v,k) => String(v) === buf && !op.children[k].disabled);
    const longer = t.options.some((v,k) => String(v).startsWith(buf) && String(v) !== buf && !op.children[k].disabled);
    if(idx >= 0 && (force || !longer)){ buf = ''; ty.textContent = ''; choose(idx); return; }
    if(!t.options.some(v => String(v).startsWith(buf)) || force){ buf = ''; ty.textContent = ''; return; }
    bufT = setTimeout(() => resolveBuf(true), 1200);
  }
  keyHandler = e => {
    if(e.key === 'Escape'){ onEsc(); return; }
    if(locked) return;
    const t = tasks[i];
    if(mode === 'kp'){
      if(/^[0-9]$/.test(e.key)) kpPress(e.key);
      else if(e.key === 'Backspace'){ e.preventDefault(); kpPress('del'); }
      else if(e.key === 'Enter'){ e.preventDefault(); kpPress('ok'); }
      return;
    }
    if(/^[0-9]$/.test(e.key) && typeof t.options[0] === 'number'){ buf += e.key; ty.textContent = 'Du skriver: ' + buf; resolveBuf(false); return; }
    if(e.key === 'Enter' && buf){ e.preventDefault(); resolveBuf(true); return; }
    if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)){
      e.preventDefault();
      const bs = [...op.querySelectorAll('.opt:not(:disabled)')]; if(!bs.length) return;
      let k = bs.indexOf(document.activeElement);
      const cols = op.classList.contains('wide') ? 2 : op.classList.contains('three') ? 3 : 4;
      const d = {ArrowLeft:-1, ArrowRight:1, ArrowUp:-cols, ArrowDown:cols}[e.key];
      k = k < 0 ? 0 : Math.max(0, Math.min(bs.length-1, k + (Math.abs(d) > 1 && bs.length <= cols ? Math.sign(d) : d)));
      bs[k].focus();
    }
  };
  show();
}

/* ================= Motor: ringtornet ================= */
function runHanoi(el, n, done, onEsc){
  let pegs, sel, moves, invalid, hints, finished, hl = null;
  const minMoves = 2**n - 1;
  const colors = ['#e0a526','#2e9e4f','#2f6fd6','#d64545','#8e44ad'];
  function reset(){ pegs = [repeat(n, k => n-k), [], []]; sel = null; moves = 0; finished = false; hl = null; }
  reset(); invalid = 0; hints = 0;
  el.innerHTML = `<p class="ask" style="text-align:center;margin:0 auto">Flytta alla ringar till det <b style="color:#2e9e4f">gröna</b> tornet. En stor ring får aldrig ligga på en mindre ring.</p>
    <div class="hanoi" id="hn"></div><div class="msg" id="msg"></div>
    <div class="tools"><span style="font-weight:bold;font-size:1.2rem" id="mv"></span><button class="btn secondary small" id="lamp">Ledtråd</button><button class="btn secondary small" id="rs">Börja om</button></div>
    <p class="keys">Klicka på ett torn för att ta en ring. Klicka på ett annat torn för att lägga den där. Tangenter: 1, 2, 3.</p>`;
  const hn = el.querySelector('#hn'), msg = el.querySelector('#msg'), mv = el.querySelector('#mv');
  const say = (t, good) => { msg.textContent = t; msg.className = 'msg' + (good ? ' good' : ''); };
  function draw(){
    hn.innerHTML = pegs.map((pg,i) => `<button class="peg ${i===2?'target':''} ${sel===i?'sel':''} ${hl&&hl.to===i?'goal':''}" data-i="${i}" aria-label="Torn ${i+1}">
      <span class="pole"></span><span class="base"></span>
      <span class="stack">${pg.map((s,k) => `<span class="ring ${sel===i&&k===pg.length-1?'lift':''} ${hl&&hl.ring===s?'glow':''}" style="width:${28 + s*(66/n)}%;background:${colors[s-1]}"></span>`).join('')}</span>
      <span class="num">${i===2 ? 'Mål · ' : ''}${i+1}</span></button>`).join('');
    hn.querySelectorAll('.peg').forEach(b => b.onclick = () => click(+b.dataset.i));
    mv.textContent = `Drag: ${moves}  (bästa: ${minMoves})`;
  }
  function nextMove(){
    const pos = {}; pegs.forEach((pg,i) => pg.forEach(s => pos[s] = i));
    const nm = (k, target) => { if(k === 0) return null; if(pos[k] === target) return nm(k-1, target); const other = 3 - pos[k] - target; return nm(k-1, other) || {ring:k, from:pos[k], to:target}; };
    return nm(n, 2);
  }
  function hint(){ const m = nextMove(); if(!m) return; hints++; sel = null; hl = m; say(`Ledtråd: flytta den ring som lyser till torn ${m.to+1}.`, true); draw(); }
  function click(i){
    if(finished) return;
    if(sel === null){ if(pegs[i].length){ sel = i; sfx.click(); say(''); } }
    else if(sel === i){ sel = null; }
    else {
      const r = pegs[sel][pegs[sel].length-1], top = pegs[i][pegs[i].length-1];
      if(top && top < r){
        invalid++; sfx.bad(); say('Oj! En stor ring kan inte ligga på en liten.'); sel = null;
        hn.classList.remove('shake'); void hn.offsetWidth; hn.classList.add('shake');
        if(invalid % 2 === 0){ draw(); hint(); return; }
      } else {
        pegs[i].push(pegs[sel].pop()); moves++; sel = null; hl = null; sfx.click();
        if(pegs[2].length === n){
          finished = true; draw(); say('Alla ringar är på plats!', true); praise();
          const extra = moves - minMoves, stars = extra <= 2 && hints === 0 ? 3 : (extra <= minMoves && hints <= 3 ? 2 : 1);
          record('logik', stars === 3);
          setTimeout(() => done(stars), 900); return;
        }
      }
    }
    draw();
  }
  el.querySelector('#lamp').onclick = hint;
  el.querySelector('#rs').onclick = () => { reset(); say(''); draw(); };
  keyHandler = e => { if(e.key === 'Escape') onEsc(); else if(['1','2','3'].includes(e.key)) click(+e.key - 1); };
  draw();
}

/* ================= Rutnät (gemensamt) ================= */
function parseMap(m){
  const S = {walls:new Set(), plates:[], blocks:[], p:null, g:null, w:m[0].length, h:m.length};
  m.forEach((row,y) => [...row].forEach((c,x) => {
    if(c === '#') S.walls.add(x+','+y);
    if(c === 'X') S.plates.push([x,y]);
    if(c === 'B') S.blocks.push([x,y]);
    if(c === 'P' || c === 'S') S.p = [x,y];
    if(c === 'G') S.g = [x,y];
  }));
  return S;
}
function cellSize(el, w, side){ const avail = el.clientWidth - (el.clientWidth > 720 ? side : 20); return Math.max(32, Math.min(62, Math.floor(Math.min(avail, 560) / w))); }

/* ================= Motor: stenblocken ================= */
function runPush(el, levels, done, onEsc){
  let li = 0, restarts = 0, hinted = false, S, hist, busy = false;
  const load = () => { S = parseMap(levels[li].map); hist = []; };
  el.innerHTML = `<div class="pips" id="lv"></div><div class="pushwrap"><div class="grid" id="gr"></div>
    <div class="pad"><button class="u" data-d="0,-1" aria-label="Upp">↑</button><button class="l" data-d="-1,0" aria-label="Vänster">←</button><button class="r" data-d="1,0" aria-label="Höger">→</button><button class="d" data-d="0,1" aria-label="Ner">↓</button></div></div>
    <div class="msg" id="msg"></div><div class="hint" id="hi" hidden></div>
    <div class="tools"><button class="btn secondary small" id="lamp">Ledtråd</button><button class="btn secondary small" id="un">Ångra</button><button class="btn secondary small" id="rs">Börja om</button></div>
    <p class="keys">Gå med pilarna (eller W A S D), med knapparna, eller klicka bredvid din figur.</p>`;
  const gr = el.querySelector('#gr'), msg = el.querySelector('#msg'), hi = el.querySelector('#hi');
  const isBlock = (x,y) => S.blocks.findIndex(b => b[0]===x && b[1]===y);
  const onPlate = (x,y) => S.plates.some(p => p[0]===x && p[1]===y);
  function draw(){
    const c = cellSize(el, S.w, 240);
    gr.style.setProperty('--c', c+'px'); gr.style.gridTemplateColumns = `repeat(${S.w}, ${c}px)`;
    let h = '';
    for(let y=0;y<S.h;y++) for(let x=0;x<S.w;x++){
      h += `<div class="t ${S.walls.has(x+','+y)?'wall':'floor'} ${onPlate(x,y)?'plate':''}" data-x="${x}" data-y="${y}">`;
      if(isBlock(x,y) >= 0) h += `<span class="block ${onPlate(x,y)?'on':''}"></span>`;
      if(S.p[0]===x && S.p[1]===y) h += `<span class="me">${avatarSVG(player.avatar, Math.round(c*.92))}</span>`;
      h += '</div>';
    }
    gr.innerHTML = h;
    gr.querySelectorAll('.t.floor').forEach(t => t.onclick = () => { const dx = +t.dataset.x - S.p[0], dy = +t.dataset.y - S.p[1]; if(Math.abs(dx) + Math.abs(dy) === 1) move(dx, dy); });
    el.querySelector('#lv').innerHTML = levels.map((_,k) => `<span class="pip ${k<li?'done':(k===li?'now':'')}"></span>`).join('');
  }
  function move(dx, dy){
    if(busy) return;
    const nx = S.p[0]+dx, ny = S.p[1]+dy;
    if(S.walls.has(nx+','+ny)){ sfx.bad(); return; }
    const bi = isBlock(nx, ny), snap = {p:[...S.p], blocks:S.blocks.map(b => [...b])};
    if(bi >= 0){
      const tx = nx+dx, ty = ny+dy;
      if(S.walls.has(tx+','+ty) || isBlock(tx,ty) >= 0){ sfx.bad(); msg.textContent = 'Den sitter fast åt det hållet.'; msg.className = 'msg'; return; }
      S.blocks[bi] = [tx, ty]; tone(160,.12,'triangle',0,.12);
    }
    hist.push(snap); S.p = [nx, ny]; msg.textContent = ''; draw();
    if(S.plates.every(p => isBlock(p[0],p[1]) >= 0)){
      busy = true; sfx.ok(); praise();
      if(li < levels.length - 1){
        msg.textContent = 'Bra! En dörr till öppnas…'; msg.className = 'msg good';
        setTimeout(() => { li++; hinted = false; hi.hidden = true; load(); busy = false; msg.textContent = ''; draw(); }, 1200);
      } else { const st = restarts === 0 ? 3 : restarts <= 2 ? 2 : 1; record('logik', st === 3); setTimeout(() => done(st), 900); }
    }
  }
  const showHint = () => { hi.innerHTML = `<p>${levels[li].hint}</p>`; hi.hidden = false; hinted = true; };
  el.querySelectorAll('.pad button').forEach(b => b.onclick = () => { const [dx,dy] = b.dataset.d.split(',').map(Number); move(dx,dy); });
  el.querySelector('#un').onclick = () => { if(busy || !hist.length) return; const s = hist.pop(); S.p = s.p; S.blocks = s.blocks; draw(); };
  el.querySelector('#rs').onclick = () => { if(busy) return; restarts++; load(); draw(); if(restarts >= 2 && !hinted) showHint(); };
  el.querySelector('#lamp').onclick = () => { if(!hinted){ restarts++; showHint(); } };
  keyHandler = e => {
    if(e.key === 'Escape'){ onEsc(); return; }
    const d = {ArrowUp:[0,-1], ArrowDown:[0,1], ArrowLeft:[-1,0], ArrowRight:[1,0], w:[0,-1], s:[0,1], a:[-1,0], d:[1,0], W:[0,-1], S:[0,1], A:[-1,0], D:[1,0]}[e.key];
    if(d){ e.preventDefault(); move(d[0], d[1]); }
    if(e.key === 'z' || e.key === 'Backspace') el.querySelector('#un').click();
  };
  load(); draw();
}

/* ================= Motor: programmering ================= */
function runProg(el, levels, rep, done, onEsc){
  let li = 0, S, pos, program = [], mult = 1, running = false, fails = 0, firstRun = true, hinted = false, cur = -1;
  const ARW = {r:['→',1,0], l:['←',-1,0], u:['↑',0,-1], d:['↓',0,1]};
  el.innerHTML = `<div class="pips" id="lv"></div><div class="pushwrap"><div class="grid" id="gr"></div>
    <div class="progside"><b>Ditt program <span id="cnt"></span></b><div class="pstrip" id="ps"></div>
      ${rep ? `<div class="mults">Antal steg: ${[1,2,3,4,5,6,7].map(n => `<button data-m="${n}">${n}</button>`).join('')}</div>` : ''}
      <div class="pad"><button class="u" data-a="u" aria-label="Upp">↑</button><button class="l" data-a="l" aria-label="Vänster">←</button><button class="r" data-a="r" aria-label="Höger">→</button><button class="d" data-a="d" aria-label="Ner">↓</button></div>
      <div class="tools" style="margin:0"><button class="btn small" id="run">Kör ▶</button><button class="btn secondary small" id="del">Sudda</button><button class="btn secondary small" id="clr">Rensa</button></div>
    </div></div>
    <div class="msg" id="msg"></div><div class="hint" id="hi" hidden></div>
    <div class="tools"><button class="btn secondary small" id="lamp">Ledtråd</button></div>
    <p class="keys">Bygg programmet först, tryck sedan Kör. Tangenter: pilar = lägg till${rep ? ', 1–7 = antal steg' : ''}, Backspace = sudda, Enter = kör.</p>`;
  const gr = el.querySelector('#gr'), ps = el.querySelector('#ps'), msg = el.querySelector('#msg'), hi = el.querySelector('#hi'), cnt = el.querySelector('#cnt');
  const say = (t, good) => { msg.textContent = t; msg.className = 'msg' + (good ? ' good' : ''); };
  const load = () => { S = parseMap(levels[li].map); pos = [...S.p]; program = []; firstRun = true; cur = -1; };
  function draw(){
    const c = cellSize(el, S.w, 500);
    gr.style.setProperty('--c', c+'px'); gr.style.gridTemplateColumns = `repeat(${S.w}, ${c}px)`;
    let h = '';
    for(let y=0;y<S.h;y++) for(let x=0;x<S.w;x++){
      h += `<div class="t ${S.walls.has(x+','+y)?'wall':'floor'}">`;
      if(S.g[0]===x && S.g[1]===y) h += `<span class="goalc">${glyph('kista', Math.round(c*.8))}</span>`;
      if(pos[0]===x && pos[1]===y) h += `<span class="me">${avatarSVG(player.avatar, Math.round(c*.92))}</span>`;
      h += '</div>';
    }
    gr.innerHTML = h;
    ps.innerHTML = program.length ? program.map((c,k) => `<span class="cmd ${k===cur?'now':''}">${c.n>1 ? c.n+' ' : ''}${ARW[c.d][0]}</span>`).join('') : '<span style="opacity:.5">Tomt – lägg till pilar</span>';
    cnt.textContent = `(${program.length} av max ${levels[li].max})`;
    el.querySelector('#lv').innerHTML = levels.map((_,k) => `<span class="pip ${k<li?'done':(k===li?'now':'')}"></span>`).join('');
    el.querySelectorAll('.mults button').forEach(b => b.classList.toggle('on', +b.dataset.m === mult));
  }
  function add(d){
    if(running) return;
    if(program.length >= levels[li].max){ sfx.bad(); say(`Du får bara använda ${levels[li].max} kommandon.`); return; }
    program.push({d, n: rep ? mult : 1}); sfx.click(); say(''); draw();
  }
  function fail(t){
    running = false; fails++; if(firstRun){ record('program', false); firstRun = false; }
    sfx.bad(); say(t + ' Ändra programmet och försök igen.');
    if(fails >= 2 && !hinted){ hi.innerHTML = `<p>${levels[li].hint}</p>`; hi.hidden = false; hinted = true; }
    setTimeout(() => { pos = [...S.p]; cur = -1; draw(); }, 1100);
  }
  function run(){
    if(running || !program.length) return;
    running = true; pos = [...S.p]; say('');
    const steps = []; program.forEach((c,k) => { for(let s=0;s<c.n;s++) steps.push([c.d,k]); });
    let si = 0;
    const tick = () => {
      if(si >= steps.length){
        cur = -1;
        if(pos[0]===S.g[0] && pos[1]===S.g[1]){
          running = false; if(firstRun){ record('program', true); firstRun = false; }
          sfx.ok(); praise();
          if(li < levels.length - 1){ say('Programmet fungerade! Nästa bana…', true); setTimeout(() => { li++; hinted = false; hi.hidden = true; load(); draw(); say(''); }, 1300); }
          else { const st = fails === 0 ? 3 : fails <= 2 ? 2 : 1; setTimeout(() => done(st), 900); }
        } else { draw(); fail('Figuren kom inte fram till kistan.'); }
        return;
      }
      const [d,k] = steps[si++], [,dx,dy] = ARW[d], n = [pos[0]+dx, pos[1]+dy];
      cur = k;
      if(S.walls.has(n[0]+','+n[1])){ draw(); fail('Aj! Figuren gick in i en vägg.'); return; }
      pos = n; tone(400 + si*20, .06, 'triangle', 0, .06); draw(); setTimeout(tick, 330);
    };
    tick();
  }
  el.querySelectorAll('.pad button').forEach(b => b.onclick = () => add(b.dataset.a));
  el.querySelectorAll('.mults button').forEach(b => b.onclick = () => { mult = +b.dataset.m; draw(); });
  el.querySelector('#run').onclick = run;
  el.querySelector('#del').onclick = () => { if(!running){ program.pop(); draw(); } };
  el.querySelector('#clr').onclick = () => { if(!running){ program = []; draw(); } };
  el.querySelector('#lamp').onclick = () => { if(!hinted){ fails++; hi.innerHTML = `<p>${levels[li].hint}</p>`; hi.hidden = false; hinted = true; } };
  keyHandler = e => {
    if(e.key === 'Escape'){ onEsc(); return; }
    const m = {ArrowUp:'u', ArrowDown:'d', ArrowLeft:'l', ArrowRight:'r'}[e.key];
    if(m){ e.preventDefault(); add(m); }
    else if(rep && /^[1-7]$/.test(e.key)){ mult = +e.key; draw(); }
    else if(e.key === 'Backspace'){ e.preventDefault(); if(!running){ program.pop(); draw(); } }
    else if(e.key === 'Enter'){ e.preventDefault(); run(); }
  };
  load(); draw();
}

showProfiles();
</script>
